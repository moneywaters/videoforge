name: Deploy VideoForge

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: user
            app: videoforge-user
          - name: gateway
            app: videoforge-gateway
          - name: brief
            app: videoforge-brief
    concurrency:
      group: deploy-${{ matrix.service.app }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Copy fly.toml to workspace root and fix paths
        run: |
          cp svc-${{ matrix.service.name }}/fly.toml ./fly-${{ matrix.service.name }}.toml
          sed -i 's|dockerfile = "../Dockerfile"|dockerfile = "Dockerfile"|' ./fly-${{ matrix.service.name }}.toml

      - name: Deploy to Fly.io
        run: flyctl deploy --config ./fly-${{ matrix.service.name }}.toml --app ${{ matrix.service.app }} --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}