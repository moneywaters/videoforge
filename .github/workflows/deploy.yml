name: Deploy VideoForge

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: video-forge

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service:
          - name: user
            fly_app: videoforge-user
            fly_toml: fly-user.toml
          - name: gateway
            fly_app: videoforge-gateway
            fly_toml: fly-gateway.toml
          - name: brief
            fly_app: videoforge-brief
            fly_toml: svc-brief/fly.toml
          - name: video
            fly_app: videoforge-video
            fly_toml: svc-video/fly.toml
          - name: campaign
            fly_app: videoforge-campaign
            fly_toml: svc-campaign/fly.toml
          - name: shopify
            fly_app: videoforge-shopify
            fly_toml: svc-shopify/fly.toml
          - name: performance
            fly_app: videoforge-performance
            fly_toml: svc-performance/fly.toml
          - name: payout
            fly_app: videoforge-payout
            fly_toml: svc-payout/fly.toml
          - name: notification
            fly_app: videoforge-notification
            fly_toml: svc-notification/fly.toml
          - name: ai-support
            fly_app: videoforge-ai-support
            fly_toml: svc-ai-support/fly.toml
          - name: admin
            fly_app: videoforge-admin
            fly_toml: svc-admin/fly.toml
    concurrency:
      group: deploy-${{ matrix.service.fly_app }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SERVICE=${{ matrix.service.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          flyctl deploy --config ${{ matrix.service.fly_toml }} --image ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
