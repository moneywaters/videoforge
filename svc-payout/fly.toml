app = "videoforge-payout"
primary_region = "lax"

[build]
  dockerfile = "../Dockerfile"
  args.SERVICE = "payout"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[experimental]
  auto_rollback = true
