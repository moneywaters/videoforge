app = "videoforge-gateway"
primary_region = "lax"

[build]
  dockerfile = "../Dockerfile"
  args.SERVICE = "gateway"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[vm]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[experimental]
  auto_rollback = true
