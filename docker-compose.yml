version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: videoforge-postgres
    environment:
      POSTGRES_DB: videoforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - videoforge-net

  # NATS message broker
  nats:
    image: nats:latest
    container_name: videoforge-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "--max_mem", "256MiB", "--max_store", "1GiB"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - videoforge-net

  # NATS Stream explorer (optional, for debugging)
  nats-stream-explorer:
    image: nats/streaming-explorer:latest
    container_name: videoforge-nats-explorer
    environment:
      NATS_URL: nats://nats:4222
    ports:
      - "8888:8080"
    depends_on:
      - nats
    networks:
      - videoforge-net

volumes:
  postgres_data:

networks:
  videoforge-net:
    driver: bridge