version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: videoforge-postgres
    environment:
      POSTGRES_DB: videoforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - videoforge-net

  # NATS message broker
  nats:
    image: nats:latest
    container_name: videoforge-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "--max_mem", "256MiB", "--max_store", "1GiB"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - videoforge-net

  # NATS Stream explorer (optional, for debugging)
  nats-stream-explorer:
    image: nats/streaming-explorer:latest
    container_name: videoforge-nats-explorer
    environment:
      NATS_URL: nats://nats:4222
    ports:
      - "8888:8080"
    depends_on:
      - nats
    networks:
      - videoforge-net

  # Shared environment variables for all services
  # These can be extended per-service as needed
  x-shared-env: &shared-env
    STORJ_ACCESS_KEY: jxx7tjnsaw5kjrc4l4hc6o64md2a
    STORJ_SECRET_KEY: j2q2rhiym7otzdyroou5zpk5bpcukrb6pnjr3q3gmkr3zp22ktr3g
    STORJ_ENDPOINT: https://gateway.storjshare.io
    STORJ_REGION: us-east-1
    STORJ_BUCKET: videoforge-uploads

volumes:
  postgres_data:

networks:
  videoforge-net:
    driver: bridge